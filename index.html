<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رواء Rawaa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@1,600&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Layout: a single centered column. Gold emblem on top, link buttons, then an arch-shaped QR card echoing the logo's arch. Petals drift in from two corners. */
  :root {
    --cream: #FAF5F0;
    --ivory: #FFFDF9;
    --gold-deep: #8A5F10;
    --gold: #C9971C;
    --gold-light: #F1D27A;
    --pink: #F4B2C5;
    --pink-deep: #E27AA0;
    --ink: #4A3512;
    --ink-soft: #7A6238;
    --font-display: "Aref Ruqaa", "Amiri", serif;
    --font-latin: "Cormorant Garamond", Georgia, serif;
    --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
    --gold-grad: linear-gradient(135deg, #8A5F10 0%, #E6BC4A 28%, #FBE9A6 50%, #C9971C 72%, #8A5F10 100%);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { background: var(--cream); }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    min-height: 100%;
    padding-block: 36px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    position: relative;
  }
  .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .petal { position: absolute; pointer-events: none; }
  .petal.p1 { top: -34px; right: -30px; width: 150px; transform: rotate(18deg); }
  .petal.p2 { top: 150px; left: -40px; width: 100px; transform: rotate(-35deg); opacity: .9; }
  .petal.p3 { bottom: 60px; right: -36px; width: 130px; transform: rotate(120deg); opacity: .9; }
  .petal.p4 { bottom: -30px; left: -20px; width: 150px; transform: rotate(-12deg); }

  main {
    position: relative; z-index: 1;
    max-width: 440px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }

  .brand { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .logo {
    width: 190px; height: 190px; max-width: 60vw; max-height: 60vw;
    border-radius: 50%;
    filter: drop-shadow(0 10px 22px rgba(138, 95, 16, .28));
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700; font-size: 44px; line-height: 1.7; padding-block: .1em .25em;
    background: var(--gold-grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-wrap: balance;
  }
  .latin { font-family: var(--font-latin); font-style: italic; font-weight: 600; font-size: 20px; letter-spacing: .18em; color: var(--gold-deep); }
  .lead { margin: 4px 0 0; color: var(--ink-soft); font-size: 16px; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-radius: 18px;
    text-decoration: none; color: var(--ink);
    background: linear-gradient(var(--ivory), var(--ivory)) padding-box, var(--gold-grad) border-box;
    border: 2px solid transparent;
    box-shadow: 0 8px 20px rgba(138, 95, 16, .14);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .link:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(138, 95, 16, .22); }
  .link:focus-visible, .copy:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 3px; }
  .icon {
    flex: none; width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--gold-grad); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
  }
  .icon svg { width: 26px; height: 26px; fill: #fffdf6; }
  .link .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .link .name { font-weight: 700; font-size: 18px; line-height: 1.3; }
  .link .sub { font-size: 14px; color: var(--ink-soft); }
  .link .go { flex: none; width: 22px; height: 22px; stroke: var(--gold-deep); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .qr-card {
    width: min(100%, 330px);
    padding: 34px 26px 24px;
    border-radius: 999px 999px 26px 26px;
    background: linear-gradient(var(--ivory), var(--ivory)) padding-box, var(--gold-grad) border-box;
    border: 3px solid transparent;
    box-shadow: 0 14px 34px rgba(138, 95, 16, .2), 0 0 0 7px var(--cream), 0 0 0 9px rgba(201, 151, 28, .45);
    display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  }
  .qr-card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--gold-deep); }
  .qr-box { width: 100%; max-width: 230px; aspect-ratio: 1; background: #fff; border-radius: 14px; padding: 12px; border: 1px solid rgba(201,151,28,.35); }
  .qr-box svg { display: block; width: 100%; height: 100%; }
  .qr-note { margin: 0; font-size: 15px; color: var(--ink-soft); text-wrap: balance; }
  .url {
    width: 100%; direction: ltr; text-align: center; font-size: 13px; color: var(--ink-soft);
    overflow-wrap: anywhere; user-select: all;
  }
  .copy {
    appearance: none; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 15px; color: #fffdf6;
    padding: 9px 22px; border: 0; border-radius: 999px;
    background: var(--gold-grad);
    box-shadow: 0 4px 12px rgba(138, 95, 16, .3);
  }
  .copy:active { transform: translateY(1px); }

  .band { width: 120px; height: 10px; border-radius: 6px; background: var(--gold-grad); opacity: .9; }
  @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
